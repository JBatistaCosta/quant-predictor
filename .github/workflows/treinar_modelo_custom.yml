name: Treino de Modelo Customizado

# Disparado pelo frontend via api/model-maintenance?tarefa=disparar-treino-custom,
# que chama a GitHub Actions API com config_id como input.
#
# Fluxo:
#   1. Frontend cria/edita uma configuração em custom_model_configs (status=rascunho)
#   2. Clica em "Treinar" → POST api/model-maintenance?tarefa=disparar-treino-custom&config_id=<uuid>
#   3. API seta status=aguardando_treino e dispara este workflow com input config_id
#   4. treinar_modelo_custom.py seta status=treinando, treina e grava metrics/trained_at
#   5. Status final: treinado (sucesso) ou erro (com error_message)
#
# Timeout: 60min — suficiente pra CatBoost/XGBoost/LightGBM em datasets de
# ~15k partidas. Random Forest e Logistic Regression terminam em <5min.
# Se o usuário configurar muitas features ou dataset crescer, aumentar aqui.

on:
  workflow_dispatch:
    inputs:
      config_id:
        description: "UUID da linha em custom_model_configs (obrigatório)"
        required: true
        type: string

jobs:
  treinar-modelo-custom:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Treinar modelo customizado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CONFIG_ID: ${{ inputs.config_id }}
        run: python scripts/treinar_modelo_custom.py
