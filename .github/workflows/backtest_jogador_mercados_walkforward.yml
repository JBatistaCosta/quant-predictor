name: Backtest Walk-Forward de Chutes/Gols por Jogador

# Roda scripts/backtest_jogador_mercados_walkforward.py -- por temporada,
# retreina do zero só com dado ESTRITAMENTE anterior a ela e avalia nela
# (nunca vista): RMSE + IC95% via bootstrap pra chutes, log-loss/Brier pra
# "marcar a qualquer momento" via afinamento de Poisson E via regressor
# direto de gols, lado a lado. Grava métrica agregada em
# player_market_backtest e previsão bruta por jogador em
# player_match_walkforward. Mesmo espírito de backtest_xi_walkforward.yml.
#
# Só workflow_dispatch -- caro (retreina 2 modelos por temporada), não faz
# sentido em cron; rodar de novo quando match_shots_fotmob crescer o
# suficiente pra valer a pena, ou depois de mudança no script.

on:
  workflow_dispatch: {}

jobs:
  backtest-jogador-mercados-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar backtest walk-forward de chutes/gols por jogador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/backtest_jogador_mercados_walkforward.py
