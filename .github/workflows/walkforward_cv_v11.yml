name: Modelo v11 - Walk-forward CV + Feature Analysis (XI titular)

# Roda scripts/walkforward_cv_v11.py:
#   - 3 folds temporais (treino/val/test por ano de match_date)
#   - 4 modelos base: CatBoost / XGBoost / LightGBM / MLP (FEATURES_V11 = V10
#     + força do XI titular abertura/fechamento, ver dados_historicos.py)
#   - Stacking LogísticaRegressão treinado em OOF predictions dos 3 folds
#   - Feature coverage (% não-nulos por feature no dataset histórico -- ponto
#     de atenção especial aqui, titular_rating_abertura/fechamento tem
#     cobertura parcial por natureza)
#   - Feature importance via CatBoost built-in (fold_3)
#   - Resultados persistidos nas tabelas model_v11_walkforward_results /
#     model_v11_feature_importance / model_v11_feature_coverage do Supabase
#
# Só workflow_dispatch — é uma rotina de VALIDAÇÃO, não vai no cron diário.
# Diferente de v9->v10 (nunca teve validação walk-forward própria), v11
# nasce com esse workflow justamente pra medir com rigor se a força do XI
# titular ajuda o modelo principal antes de confiar nela em produção --
# catboost_v11/xgboost_v11/lightgbm_v11/mlp_v11 já rodam todo dia junto com
# v9/v10 no loop de rodar_predicoes.py (mesma convenção de TREINADORES),
# então esse workflow é o jeito de medir se vale a pena manter.
# Tempo estimado: 45-90min (4 modelos × 3 folds + refit fold_3 para stacking).
# Timeout generoso (150min) para cobrir o MLP que é mais lento que as árvores.

on:
  workflow_dispatch: {}

jobs:
  walkforward-cv-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar walk-forward CV v11
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/walkforward_cv_v11.py
