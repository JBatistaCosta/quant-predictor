name: catboost_v9 - Comparar com Elo global por xG (validação)

# Roda scripts/comparar_catboost_v9_elo_xg.py: o MESMO catboost_v9 do
# walk-forward (3 folds anuais, teste 2023/2024/2025) com e sem as variáveis
# `elo_xg_home`/`elo_xg_away`/`elo_xg_diff` (Elo global por xG, tabela
# `team_elo_xg_history`). Parada antecipada só na validação.
#
# Só LÊ do banco e imprime o resultado nos logs (linhas JSON:fold:/JSON:agregado:/
# RESUMO:) -- não grava nada, não registra modelo novo, não mexe no cron diário.
# Só workflow_dispatch -- é uma rotina de VALIDAÇÃO.
# Tempo estimado: ~40-60 min (a montagem do dataset empilhado domina; o treino em si leva minutos).

on:
  workflow_dispatch: {}

jobs:
  comparar-catboost-v9-elo-xg:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Comparar catboost_v9 com e sem Elo global por xG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/comparar_catboost_v9_elo_xg.py
