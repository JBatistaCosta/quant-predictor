name: Modelos Customizados - Prever Partidas Futuras

# Aplica cada custom_model_config JÁ TREINADA (nunca treina aqui) sobre as
# partidas ainda não disputadas dentro do escopo de liga da configuração,
# gravando em model_predictions. Dois consumidores: a Carteira (Paper
# Trading, /carteira-paper-trading, mercados 1x2/over_under_2.5/btts -- só
# lê previsão de partida status=scheduled ali) e, desde 10/09, o painel
# "Cartões e Faltas" em AnaliseEstatisticaJogo.jsx (mercados cartoes_over_
# under_*/faltas_over_under_* "geral") -- pré-computar aqui deixa esse
# painel instantâneo, em vez de disparar uma estimativa sob demanda a cada
# clique (ver MERCADOS_CARTOES_FALTAS_GERAL no script).
# Ver docstring completa em scripts/prever_partidas_futuras_custom.py.
#
# Agendado 1h depois do predict.yml (04:00 UTC, modelos "de fábrica" +
# refresh de market_odds) e antes do cron da Carteira em vercel.json
# (09:00 UTC, tarefa=paper-carteira-rodar-todas) -- pra quando a Carteira
# rodar "apostar", a previsão do dia já exista.

on:
  schedule:
    # 05:00 UTC todo dia.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  prever-partidas-futuras-custom:
    runs-on: ubuntu-latest
    # Nunca medido em produção ainda (primeira rodada) -- folga generosa de
    # propósito, mesmo espírito de backtest_kelly.yml (200min)/walkforward_
    # cv_v9.yml (150min) pra job com múltiplos modelos/datasets pesados.
    # Cada config elegível monta o dataset "Feature Stacked" do zero (minutos
    # cada, ver predict.yml) -- ajustar depois de ver o tempo real.
    timeout-minutes: 180

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Prever partidas futuras (modelos customizados)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/prever_partidas_futuras_custom.py
