name: Backfill Walk-Forward do Modelo de Odds (xG Agregado por Jogador)

# Roda scripts/backfill_xg_agregado_walkforward.py -- agrega lambda_xg_jogo
# (já persistido por jogador-partida em player_match_walkforward) por
# time-partida, aplica kappa_liga (league_model_params) e grava as
# probabilidades derivadas (1X2/over-under/BTTS/handicap) em
# model_predictions (model_name='xg_jogador_agregado_walkforward_v1') --
# habilita validação real via api/backtest-betting.js contra
# dixon_coles_walkforward_v1, sem esperar partida scheduled nova.
#
# Só workflow_dispatch -- paginação de ~473 mil linhas, caro o bastante
# pra não valer cron; rodar de novo depois de um novo backtest de
# jogador-mercados ou depois de recalibrar kappa_liga
# (arquivos_do_claude/calibrar_kappa_xg_agregado.py).

on:
  workflow_dispatch: {}

jobs:
  backfill-xg-agregado-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar backfill do modelo de odds (xG agregado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/backfill_xg_agregado_walkforward.py
