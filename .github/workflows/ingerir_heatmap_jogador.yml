name: Mapa de calor por jogador (FotMob)

# Roda scripts/ingerir_heatmap_jogador.py: posição dos toques de cada jogador por partida encerrada
# (match_player_heatmap_fotmob), base de posição para a futura simulação de jogo por cadeia de Markov.
# FotMob é grátis; 2 chamadas por partida com pacing de 1,3 s (~3 s/partida). O mapa só existe para jogos de
# ~março/2026 em diante (antes: 404, registrado e não repetido). Backfill inicial: ~2.400 partidas (~2 h) --
# dispare manualmente SEM limite; a execução diária pega só o que é novo.
#
# PRÉ-REQUISITO: migration 20261004100000_create_match_player_heatmap_fotmob.sql aplicada no Supabase.

on:
  schedule:
    - cron: "40 7 * * *"  # 07:40 UTC diário, depois do sync de partidas (06:00)
  workflow_dispatch:
    inputs:
      limite:
        description: "Processa só as N partidas mais recentes pendentes (vazio = todas)"
        required: false
        type: string
      desde:
        description: "Data inicial YYYY-MM-DD (vazio = 2026-03-01)"
        required: false
        type: string
      match_ids:
        description: "Ids internos separados por vírgula (ignora o registro de coleta)"
        required: false
        type: string

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Coletar mapas de calor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIMITE: ${{ inputs.limite }}
          DESDE: ${{ inputs.desde }}
          MATCH_IDS: ${{ inputs.match_ids }}
          AGENDADO: ${{ github.event_name == 'schedule' }}
        run: |
          ARGS=""
          if [ -n "$LIMITE" ]; then ARGS="$ARGS --limite $LIMITE"; fi
          if [ "$AGENDADO" = "true" ] && [ -z "$LIMITE" ]; then ARGS="$ARGS --limite 400"; fi   # execução diária: teto de segurança
          if [ -n "$DESDE" ]; then ARGS="$ARGS --desde $DESDE"; fi
          if [ -n "$MATCH_IDS" ]; then ARGS="$ARGS --match-ids $MATCH_IDS"; fi
          python scripts/ingerir_heatmap_jogador.py $ARGS
