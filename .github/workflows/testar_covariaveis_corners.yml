name: Modelo Misto - Teste de Ablação (chutes/posse no regressor de escanteios)

# Roda scripts/testar_covariaveis_corners.py -- mede se as features de
# pressão ofensiva (chutes, chutes bloqueados, chutes no alvo, posse,
# chances claras, toques na área adversária) contribuem de verdade pro
# regressor de lambda de escanteios (hibrido_corners_v1), comparando
# log-verossimilhança/log-loss O/U9.5 out-of-sample com e sem essas
# colunas no feature set. Ver docstring do script pro contexto completo.
#
# Ferramenta de análise, não de produção -- só workflow_dispatch, sem cron
# (mesma categoria de avaliar_modelo_misto_vs_mercado.yml/backtest_kelly.yml).
# Só leitura: não grava nada no Supabase.

on:
  workflow_dispatch: {}

jobs:
  testar-covariaveis-corners:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Testar covariáveis de pressão ofensiva no regressor de escanteios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/testar_covariaveis_corners.py
