name: Calibrar motor de Markov (cartão amarelo/vermelho)

# Roda arquivos_do_claude/calibrar_markov_cartoes.py -- calibra
# mult_estado_placar (match_team_cartoes_estado), mult_janela_pos_evento e
# mult_vantagem_numerica (match_team_event_response, proxy via janela
# "regime" pós-expulsão) e mult_minuto_bin (histograma de
# match_events.minute) de cartão amarelo/vermelho com dado PRÓPRIO do
# projeto -- diferente de escanteio/falta (Achado 13,
# ACHADOS_COMPORTAMENTO.md), cartão TEM minuto real no pipeline, então aqui
# o ganho é substituir uma forma externa (StatsBomb) por uma calibrada
# direto nos dados do projeto. Grava em league_markov_params.
#
# PRÉ-REQUISITO: match_team_cartoes_estado e match_team_event_response
# (colunas de cartão) populadas -- já é o caso em produção via
# api/model-maintenance.js (?tarefa=derivar-cartoes-estado, chamada
# automática após cada ingestão de partida desde a Fase 1).
#
# Idempotente (upsert por league_id+evento+tipo+chave) -- workflow_dispatch
# manual, sem cron: mesmo espírito de calibrar_markov_gols_chutes.yml.

on:
  workflow_dispatch: {}

jobs:
  calibrar-markov-cartoes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar calibração de cartões
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python arquivos_do_claude/calibrar_markov_cartoes.py
