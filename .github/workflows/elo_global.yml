name: Recalcular Elo Global (todas as competições)

# Recalcula o escopo='global' de team_elo/team_elo_history (scripts/elo_global.py)
# — um único pool de rating por time, juntando TODAS as partidas de TODAS as
# competições (domésticas + continentais + internacionais). Usado só pelo
# painel /ratings (RatingClubes.jsx), não alimenta o pipeline de ML (que
# continua consumindo escopo='liga', isolado por competição, sem mudança).
#
# Full recompute a cada execução — ~30 mil partidas processam em segundos,
# sem custo de cota externa (não chama nenhuma API de terceiros).
#
# Roda 30min depois do sync-matches (06:00 UTC, ver vercel.json) pra já
# pegar os placares do dia atualizados.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  elo-global:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Recalcular Elo global
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/elo_global.py
