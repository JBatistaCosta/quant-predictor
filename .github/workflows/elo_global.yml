name: Recalcular Elo Global (todas as competições)

# Atualiza o escopo='global' de team_elo/team_elo_history (scripts/elo_global.py)
# — um único pool de rating por time, juntando TODAS as partidas de TODAS as
# competições (domésticas + continentais + internacionais). Usado só pelo
# painel /ratings (RatingClubes.jsx), não alimenta o pipeline de ML (que
# continua consumindo escopo='liga', isolado por competição, sem mudança).
#
# Dois modos (ver docstring do script pro detalhe de quando usar cada um):
#   - incremental (cron diário): só aplica as partidas novas por cima do
#     rating atual -- mais barato, certo pro dia a dia (jogos novos das
#     ligas que já estavam na base).
#   - completo (só manual, workflow_dispatch): recalcula tudo do zero.
#     OBRIGATÓRIO rodar depois de adicionar uma liga ou temporada nova —
#     partidas históricas "novas" (com data no passado) só entram na ordem
#     cronológica certa com um recompute completo; o modo incremental
#     detecta esse caso e aborta sozinho pedindo pra rodar completo.
#
# Sem custo de cota externa (não chama nenhuma API de terceiros) — ~30 mil
# partidas processam em segundos, bem longe do timeout de 30min do job.
#
# Roda 30min depois do sync-matches (06:00 UTC, ver vercel.json) pra já
# pegar os placares do dia atualizados.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = recalcula tudo (usar ao adicionar liga/temporada nova) | incremental = só as partidas novas"
        required: false
        type: choice
        options:
          - incremental
          - completo
        default: incremental

jobs:
  elo-global:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Atualizar Elo global
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MODO="${{ inputs.modo }}"
          if [ -z "$MODO" ]; then MODO="incremental"; fi
          python scripts/elo_global.py --modo "$MODO"
