name: Model Benchmarking - Rodar Predições

on:
  schedule:
    # 04:00 UTC todo dia. Cron do GitHub Actions é sempre em UTC, não no
    # fuso do usuário -- ajustar aqui se "04:00 da manhã" precisar ser em
    # horário de Brasília (UTC-3) em vez de UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  rodar-predicoes:
    runs-on: ubuntu-latest
    # Era 15min (já apertado com as 5 ligas de elite -- runs saudáveis
    # ficavam por volta de 12-13min). Brasileirão entrou no dataset
    # "Feature Stacked" (`dados_historicos.LIGAS_MODEL_BENCHMARKING`) e só
    # montar o dataset agora leva ~13,5min sozinho (medido direto,
    # +20% de volume de partida) -- sem folga nenhuma pro resto do
    # script (treino dos modelos de árvore + persistência). Triplicado
    # com folga generosa, mesmo espírito de `backtest_kelly.yml` quando
    # o escopo cresceu.
    timeout-minutes: 45

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar rotina de predições
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/rodar_predicoes.py
