name: Model Benchmarking - Rodar Predições

on:
  schedule:
    # 04:00 UTC todo dia. Cron do GitHub Actions é sempre em UTC, não no
    # fuso do usuário -- ajustar aqui se "04:00 da manhã" precisar ser em
    # horário de Brasília (UTC-3) em vez de UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  rodar-predicoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar rotina de predições
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/rodar_predicoes.py
