name: Model Benchmarking - Sync Valor de Mercado (Transfermarkt)

# Fase 1 do enriquecimento de valor de jogador discutido pro Model
# Benchmarking: casa jogador interno <-> Transfermarkt e faz backfill do
# histórico de valor de mercado (marketValueHistory). Só workflow_dispatch
# por enquanto (não entra no cron ainda) -- é scraping não-oficial (zona
# cinzenta de ToS, sem SLA), então cada rodada é disparada manualmente e
# acompanhada, processando um lote por vez (mesmo padrão de
# ?tarefa=player-elo em api/model-maintenance.js: idempotente, retoma
# sozinho de onde parou via o que já existe em player_source_ids/
# player_market_value_history).
#
# Não existe imagem publicada da transfermarkt-api no Docker Hub -- o job
# clona o repositório e roda `python app/main.py` direto (mesma técnica
# usada pra validar o formato real da resposta antes de escrever os
# parsers em scripts/matching_transfermarkt.py e
# scripts/backfill_valor_mercado.py).

on:
  workflow_dispatch:
    inputs:
      limite_jogadores:
        description: "Quantos jogadores processar nesta rodada (por script) -- lote pequeno de propósito, rode de novo pra continuar."
        required: false
        default: "30"

jobs:
  sync-valores-mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências do projeto
        run: pip install -r scripts/requirements.txt

      - name: Clonar e instalar a transfermarkt-api (felipeall/transfermarkt-api)
        run: |
          git clone --depth 1 https://github.com/felipeall/transfermarkt-api.git /tmp/transfermarkt-api
          python3 -m venv /tmp/transfermarkt-api/venv
          /tmp/transfermarkt-api/venv/bin/pip install --quiet -r /tmp/transfermarkt-api/requirements.txt

      - name: Subir a transfermarkt-api em background
        working-directory: /tmp/transfermarkt-api
        run: |
          PYTHONPATH=. nohup ./venv/bin/python app/main.py > /tmp/tm-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sS -m 3 http://127.0.0.1:8000/openapi.json -o /dev/null; then
              echo "transfermarkt-api no ar."
              exit 0
            fi
            sleep 2
          done
          echo "transfermarkt-api não respondeu a tempo -- log:"
          cat /tmp/tm-api.log
          exit 1

      - name: Casar jogadores com o Transfermarkt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIMITE_JOGADORES: ${{ github.event.inputs.limite_jogadores }}
          TRANSFERMARKT_API_BASE: http://127.0.0.1:8000
        run: python scripts/matching_transfermarkt.py

      - name: Backfill do histórico de valor de mercado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIMITE_JOGADORES: ${{ github.event.inputs.limite_jogadores }}
          TRANSFERMARKT_API_BASE: http://127.0.0.1:8000
        run: python scripts/backfill_valor_mercado.py
