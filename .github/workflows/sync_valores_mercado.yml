name: Model Benchmarking - Sync Valor de Mercado (FotMob)

# Fase 1 do enriquecimento de valor de jogador discutido pro Model
# Benchmarking. Pivô de abordagem: a 1ª versão tentava casar jogador
# interno com o Transfermarkt via crosswalk (nome+clube+idade) -- rodando
# de verdade em produção, o IP do runner do GitHub Actions apanhava
# bloqueio da defesa anti-scraping do Transfermarkt (15/15 buscas com HTTP
# 500). Trocado pelo FotMob: já tem série temporal de valor de mercado em
# euros dentro do próprio payload do jogador
# (`GET https://www.fotmob.com/api/data/playerData?id={fotmob_player_id}`
# campo `marketValues.values`), mesmo endpoint já usado em produção neste
# projeto (arquivos_do_claude/ingestao_fotmob_elenco.py) sem indício de
# bloqueio de IP -- e `players.fotmob_player_id` já existe e já está 100%
# populado no escopo, então não precisa de crosswalk nenhum.
#
# Só workflow_dispatch por enquanto (não entra no cron) -- primeira rodada
# real em produção ainda não confirmada. Processa um lote por vez (mesmo
# padrão de ?tarefa=player-elo em api/model-maintenance.js: idempotente,
# retoma sozinho de onde parou via o que já existe em
# player_market_value_history).

on:
  workflow_dispatch:
    inputs:
      limite_jogadores:
        description: "Quantos jogadores processar nesta rodada -- lote pequeno de propósito, rode de novo pra continuar."
        required: false
        default: "30"

jobs:
  sync-valores-mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Backfill do histórico de valor de mercado (FotMob)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIMITE_JOGADORES: ${{ github.event.inputs.limite_jogadores }}
        run: python scripts/backfill_valor_mercado.py
