name: Model Benchmarking - Sync Valor de Mercado (Transfermarkt)

# Fase 1 do enriquecimento de valor de jogador discutido pro Model
# Benchmarking: casa jogador interno <-> Transfermarkt e faz backfill do
# histórico de valor de mercado (marketValueHistory). Só workflow_dispatch
# (não entra no cron) -- é scraping não-oficial (zona cinzenta de ToS, sem
# SLA), então cada rodada é disparada manualmente e acompanhada,
# processando um lote por vez (mesmo padrão de ?tarefa=player-elo em
# api/model-maintenance.js: idempotente, retoma sozinho de onde parou via
# o que já existe em player_source_ids/player_market_value_history).
#
# IMPORTANTE -- por que a transfermarkt-api NÃO sobe dentro deste job (como
# na 1ª versão): testado em produção, o IP do runner do GitHub Actions
# (faixa compartilhada Azure/GitHub) apanha bloqueio/rate-limit da defesa
# anti-scraping do Transfermarkt -- 15/15 buscas vieram HTTP 500, enquanto
# as MESMAS buscas, mesmo código, de um IP não-datacenter funcionaram
# 13/13. IP de datacenter compartilhado é reconhecidamente mais visado por
# proteção anti-bot que IP residencial/pessoal.
#
# Por isso a transfermarkt-api roda em infraestrutura PRÓPRIA (fora do GitHub
# Actions) e este workflow só CHAMA essa instância via TRANSFERMARKT_API_URL
# (secret, ex.: um túnel Cloudflare apontando pro seu servidor local). Ver
# README/comentário abaixo pra como subir isso.
#
# Setup necessário (uma vez):
#   1. No seu servidor/máquina própria: clonar felipeall/transfermarkt-api,
#      `docker build -t transfermarkt-api . && docker run -d -p 8000:8000 transfermarkt-api`
#      (ou `python app/main.py` direto, sem Docker).
#   2. Expor publicamente com HTTPS estável, ex. Cloudflare Tunnel (grátis):
#      `cloudflared tunnel --url http://localhost:8000` (túnel rápido) ou um
#      túnel nomeado persistente se quiser a mesma URL sempre.
#   3. Cadastrar a URL resultante como secret TRANSFERMARKT_API_URL no repo
#      (Settings -> Secrets and variables -> Actions).
#   4. Garantir que a instância esteja no ar antes de disparar este workflow
#      manualmente (ele falha rápido, sem gastar nada, se não conseguir
#      alcançar a URL).

on:
  workflow_dispatch:
    inputs:
      limite_jogadores:
        description: "Quantos jogadores processar nesta rodada (por script) -- lote pequeno de propósito, rode de novo pra continuar."
        required: false
        default: "30"

jobs:
  sync-valores-mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências do projeto
        run: pip install -r scripts/requirements.txt

      - name: Checar se a transfermarkt-api própria está acessível
        env:
          TRANSFERMARKT_API_URL: ${{ secrets.TRANSFERMARKT_API_URL }}
        run: |
          if [ -z "$TRANSFERMARKT_API_URL" ]; then
            echo "Secret TRANSFERMARKT_API_URL não configurada -- ver comentário no topo deste workflow pra como subir sua própria instância."
            exit 1
          fi
          if ! curl -sS -m 10 "$TRANSFERMARKT_API_URL/openapi.json" -o /dev/null; then
            echo "Não consegui alcançar $TRANSFERMARKT_API_URL -- confirme que sua instância/túnel está no ar antes de rodar de novo."
            exit 1
          fi
          echo "transfermarkt-api própria respondendo."

      - name: Casar jogadores com o Transfermarkt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIMITE_JOGADORES: ${{ github.event.inputs.limite_jogadores }}
          TRANSFERMARKT_API_BASE: ${{ secrets.TRANSFERMARKT_API_URL }}
        run: python scripts/matching_transfermarkt.py

      - name: Backfill do histórico de valor de mercado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIMITE_JOGADORES: ${{ github.event.inputs.limite_jogadores }}
          TRANSFERMARKT_API_BASE: ${{ secrets.TRANSFERMARKT_API_URL }}
        run: python scripts/backfill_valor_mercado.py
