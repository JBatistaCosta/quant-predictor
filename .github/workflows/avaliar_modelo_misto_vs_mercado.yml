name: Modelo Misto - Avaliação Pareada vs. Mercado (Pinnacle devigado)

# Roda scripts/avaliar_modelo_misto_vs_mercado.py -- compara, por bootstrap
# PAREADO (backtest_kelly.comparar_pareado_com_mercado), o log-loss das duas
# variantes do modelo misto (hibrido_gols_v1, hibrido_gols_xg_v1) contra a
# probabilidade implícita da Pinnacle devigada, nos 3 mercados com odds reais
# e métrica própria: 1X2, Over/Under 2.5 e BTTS.
#
# Ferramenta de análise, não de produção -- só workflow_dispatch, sem cron
# (mesma categoria de backtest_kelly.yml). Só leitura: não grava nada no
# Supabase.

on:
  workflow_dispatch: {}

jobs:
  avaliar-modelo-misto-vs-mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Avaliar modelo misto contra o mercado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/avaliar_modelo_misto_vs_mercado.py
