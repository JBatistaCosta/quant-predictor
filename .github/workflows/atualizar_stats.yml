name: Atualizar Placares e Estatísticas de Partidas Finalizadas

# Varre TODAS as ligas com cobertura FotMob e preenche lacunas:
#   - placares faltando em `matches` (home_goals/away_goals IS NULL)
#   - ausência de linhas em `match_stats_fotmob` (e tabelas derivadas:
#     match_context_fotmob, match_lineup_fotmob, match_player_stats_fotmob,
#     match_shots_fotmob, players)
#
# Complementa ingestao_fotmob.py (exige liga+temporada explícitos) com uma
# rotina automática pós-sync: o cron sync-matches (06:00 UTC) registra as
# partidas mas não busca stats — este workflow, rodando às 08:00 UTC, fecha
# essa lacuna pra jogos finalizados no dia anterior.
#
# Pré-requisito: crosswalk de times (team_source_ids, source='fotmob') já
# resolvido pra cada liga. Times sem crosswalk têm placar atualizado mas
# stats puladas (aviso no log — não é erro fatal).
#
# Pacing: 1.3s entre chamadas de API (mesmo do ingestao_fotmob.py).
# Estimativa de consumo no pior caso (1ª execução histórica, ~5.000 partidas
# pendentes): ~2h de execução, sem custo de cota externa (FotMob é grátis).
# Execuções diárias subsequentes: ~30 partidas/dia, < 1 min.

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC diário, após sync-matches (06:00 UTC)
  workflow_dispatch:
    inputs:
      limite:
        description: "Processa só as N primeiras partidas pendentes (vazio = todas)"
        required: false
        type: string
      league_id:
        description: "Restringe a uma liga interna (vazio = todas com cobertura FotMob)"
        required: false
        type: string
      modo:
        description: "tudo=placar+stats | placar=só placares faltando | stats=só estatísticas"
        required: false
        type: choice
        options:
          - tudo
          - placar
          - stats
        default: tudo
      forcar:
        description: "Reprocessa mesmo partidas que já têm dados parciais"
        required: false
        type: boolean
        default: false

jobs:
  atualizar-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Atualizar partidas finalizadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limite }}" ]; then ARGS="$ARGS --limite ${{ inputs.limite }}"; fi
          if [ -n "${{ inputs.league_id }}" ]; then ARGS="$ARGS --league-id ${{ inputs.league_id }}"; fi
          if [ -n "${{ inputs.modo }}" ]; then ARGS="$ARGS --modo ${{ inputs.modo }}"; fi
          if [ "${{ inputs.forcar }}" = "true" ]; then ARGS="$ARGS --forcar"; fi
          python scripts/atualizar_partidas_finalizadas.py $ARGS
