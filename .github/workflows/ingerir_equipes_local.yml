name: Ingestão de dados de equipe (repository-fotmob — local)

# Lê os 295 arquivos data_teams/<id>.json.gz do repositório
# jbatistacosta/repository-fotmob e popula em teams:
#   - stadium_capacity INTEGER  (capacidade do estádio)
#   - stadium_surface  TEXT     (superfície do campo)
#
# Zero chamadas de rede ao FotMob — todo o scraping já está nos arquivos.
# Workflow_dispatch manual — idempotente (upsert por teams.id).
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Processa só os N primeiros arquivos (vazio = todos)"
        required: false
        type: string

jobs:
  ingerir-equipes-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do quant-predictor
        uses: actions/checkout@v4

      - name: Checkout do repository-fotmob (dumps já baixados)
        uses: actions/checkout@v4
        with:
          repository: jbatistacosta/repository-fotmob
          path: _repository-fotmob
          token: ${{ secrets.REPO_FOTMOB_PAT }}

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar ingestão de equipes locais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS="--pasta-dados _repository-fotmob"
          if [ -n "${{ inputs.limite }}" ]; then ARGS="$ARGS --limite ${{ inputs.limite }}"; fi
          python arquivos_do_claude/ingestao_equipes_local.py $ARGS
