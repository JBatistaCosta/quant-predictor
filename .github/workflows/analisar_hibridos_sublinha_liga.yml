name: Híbridos - quebra por sub-linha e liga

# Roda scripts/analisar_hibridos_sublinha_liga.py -- quebra hibrido_gols_xg_v1,
# hibrido_gols_xg_v2_estado e hibrido_corners_v1 por sub-linha (mandante/
# empate/visitante, under/over, sim/não em BTTS) e, dentro de cada sub-linha,
# por liga. Complementa a matriz de confiabilidade EV (odd x edge): aqui a
# pergunta é se o desempenho ruim desses modelos é uniforme entre seleções/
# ligas ou concentrado nalgumas.
#
# Monta o dataset "Feature Stacked" (~90-110min) -- workflow_dispatch só,
# não é cron (ferramenta de análise/pesquisa, não de produção). Não escreve
# nada no Supabase, só relatório em stdout.

on:
  workflow_dispatch: {}

jobs:
  analisar-hibridos-sublinha-liga:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar quebra por sub-linha e liga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/analisar_hibridos_sublinha_liga.py
