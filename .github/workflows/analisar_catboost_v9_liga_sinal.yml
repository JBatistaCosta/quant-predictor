name: catboost_v9 - Carteira restrita (mandante/1X2/odd 1.30-2.50/edge 5-10%)

# Simula a carteira cronológica de catboost_v9 restrita à única célula
# confiavel=true da matriz de confiabilidade EV (mandante, 1X2, odd
# [1.30,2.50), edge [5%,10%)) e persiste o ledger jogo-a-jogo em
# carteira_catboost_v9_historico -- alimenta a aba "Carteira catboost_v9"
# em Sugestões de Valor. Ver docstring completa em
# scripts/analisar_catboost_v9_liga_sinal.py.
#
# Leve (só lê model_predictions já persistidas, não retreina nada) --
# workflow_dispatch só, roda manualmente depois de cada backfill/produção
# nova de catboost_v9.

on:
  workflow_dispatch: {}

jobs:
  analisar-catboost-v9-liga-sinal:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Simular carteira restrita (catboost_v9)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/analisar_catboost_v9_liga_sinal.py
