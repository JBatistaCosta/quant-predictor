name: Blend hibrido_gols_xg_v1 + Pinnacle (Over/Under 2.5)

# Roda scripts/rodar_blend_odds_pinnacle.py -- combina hibrido_gols_xg_v1
# com a Pinnacle devigada (odd de ABERTURA, MIN(captured_at) por seleção)
# via peso por faixa de magnitude de mercado, gravando
# model_name='blend_xg_pinnacle_ou25_v1' em model_predictions
# (over_under_2.5).
#
# CRON DESATIVADO (17/09) -- a validação por walk-forward que justificou
# produção não reproduz mais com o mesmo filtro (n=5.910, só Pinnacle):
# hoje o mercado bate o blend, o oposto do resultado documentado em
# CONTEXTO_PROJETO.md ("Blend pós-hoc modelo+mercado"). Causa raiz ainda
# não confirmada (candidatos: split cronológico 60/20/20 de
# treinar_modelo_hibrido.py reescreve p_modelo de partidas ainda dentro
# da janela de teste móvel a cada retreino diário -- ou captura
# retroativa de odds mudando a odd de abertura resolvida). NÃO
# reativar o schedule sem antes confirmar a causa e revalidar. Rodar
# manualmente (workflow_dispatch, de preferência --backtest) só pra
# investigação, não em produção real.

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Janela de dias à frente para combinar (default 7)"
        required: false
        type: string
      backtest_dias:
        description: "Se preenchido, roda em modo --backtest (partidas 'finished' nos últimos N dias) em vez de 'scheduled' -- usado pra popular histórico e medir desempenho real do blend em /modelos"
        required: false
        type: string

jobs:
  rodar-blend-odds-pinnacle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Combinar hibrido_gols_xg_v1 com Pinnacle devigada
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "${{ inputs.backtest_dias }}" ]; then
            python scripts/rodar_blend_odds_pinnacle.py --backtest --dias ${{ inputs.backtest_dias }}
          else
            ARGS=""
            if [ -n "${{ inputs.dias }}" ]; then ARGS="--dias ${{ inputs.dias }}"; fi
            python scripts/rodar_blend_odds_pinnacle.py $ARGS
          fi
