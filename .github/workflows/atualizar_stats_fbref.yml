name: Atualizar Estatísticas de Partidas Finalizadas (FBref)

# Roda arquivos_do_claude/ingestao_stats_fbref.py (xG, chutes, posse, faltas,
# cartões via FBref/soccerdata) -- preenche `match_stats`, tabela usada pelo
# resumo de forma em AnaliseHistorica.jsx, AnaliseEstatisticaJogo.jsx e
# TimeDetalhe.jsx (ver CONTEXTO_PROJETO.md: achado de match_stats parada
# desde 15/07/2026, sem nenhuma automação até este workflow existir).
#
# Diferente de atualizar_stats.yml (FotMob, ~30 partidas/dia, minutos): o
# FBref só expõe estatística por partida via scraping do log de jogos de
# UMA liga+temporada inteira por vez (soccerdata.read_team_match_stats),
# ~20-40min cada, com rate limit do próprio site -- não dá pra rodar as 6
# ligas do dia sem risco de bloqueio de IP nem caber num cron rápido.
#
# Por isso: no cron (sem input manual), roda só 1 liga por dia -- dia do ano
# mod 6 escolhe qual das 6 (BSA/PL/PD/SA/BL1/FL1), sempre na temporada mais
# recente ("auto", resolvida pelo próprio script a partir de `matches`) --
# ciclo completo (todas as 6 ligas atualizadas) fecha em 1 semana. Mesmo
# padrão do `elo-rotativo` em api/model-maintenance.js.
#
# Disparo manual (workflow_dispatch, inclusive pelo botão "Atualizar
# match_stats FBref (Actions)" em RodadaPrevisoes.jsx via
# ?tarefa=disparar-atualizar-stats-fbref): permite escolher liga+temporada
# específicas, pra backfill dirigido em vez de esperar o rodízio.

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC diário, depois do atualizar_stats.yml (FotMob, 08:00 UTC)
  workflow_dispatch:
    inputs:
      liga:
        description: "Código da liga no soccerdata (vazio = rodízio automático do dia)"
        required: false
        type: choice
        options:
          - ""
          - BSA
          - PL
          - PD
          - SA
          - BL1
          - FL1
        default: ""
      temporada:
        description: "Temporada (ex.: 2026; vazio = a mais recente com jogo no banco pra essa liga)"
        required: false
        type: string

jobs:
  atualizar-stats-fbref:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar dependências
        run: pip install soccerdata supabase pandas

      - name: Escolher liga do dia (rodízio, só quando não veio input manual)
        id: escolher
        run: |
          LIGA="${{ inputs.liga }}"
          if [ -z "$LIGA" ]; then
            LIGAS=(BSA PL PD SA BL1 FL1)
            DIA=$(date +%j)
            IDX=$((10#$DIA % 6))
            LIGA="${LIGAS[$IDX]}"
            echo "Rodízio automático (dia do ano $DIA mod 6 = $IDX): $LIGA"
          fi
          TEMPORADA="${{ inputs.temporada }}"
          if [ -z "$TEMPORADA" ]; then TEMPORADA="auto"; fi
          echo "liga=$LIGA" >> "$GITHUB_OUTPUT"
          echo "temporada=$TEMPORADA" >> "$GITHUB_OUTPUT"

      - name: Atualizar match_stats (FBref)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python arquivos_do_claude/ingestao_stats_fbref.py "${{ steps.escolher.outputs.liga }}" "${{ steps.escolher.outputs.temporada }}"
