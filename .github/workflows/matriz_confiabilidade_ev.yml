name: Matriz de confiabilidade odd x EV (Gols/Escanteios/Cartões)

# Roda scripts/matriz_confiabilidade_ev.py -- pergunta do usuário: existe
# uma combinação (faixa de odd, faixa de edge) onde um modelo bate o
# mercado de forma repetível, mesmo perdendo no agregado? (ex.: "entre
# 13% e 25% de EV pra odds de 3.1 a 5.7 é confiável")
#
# Cobre os pares modelo/mercado com previsão out-of-sample + mercado real
# já validados neste projeto: hibrido_gols_xg_v1 e hibrido_gols_xg_v2_estado
# (1X2/over_under_2.5/btts), hibrido_corners_v1 (corners_over_under_9.5), o
# classificador de Cartões (6 linhas), catboost_v9 (1X2/over_under_2.5 --
# pedido do usuário depois da auditoria dos modelos "v9", CONTEXTO_
# PROJETO.md 16-17/09) e a família v11 completa (catboost/xgboost/lightgbm/
# mlp x {cru, calibrado_isotonic, calibrado_platt} + stacking_v11, 1X2/
# over_under_2.5 -- pedido do usuário 21/09 pra checar com a metodologia
# oficial, não só SQL ad-hoc). Monta o dataset "Feature Stacked"
# (~90-110min) UMA VEZ e reaproveita pros modelos híbridos/cartões;
# catboost_v9 e a família v11 já têm previsão persistida em
# model_predictions, não precisam desse dataset.
#
# Correção de metodologia em relação a analisar_cartoes_edge_ev.yml (que
# devolveu ROI implausível, +100% a +880%, quase certamente artefato de
# poucas apostas de odd extrema dominando a média -- ver CONTEXTO_
# PROJETO.md "PENDENTE DE INVESTIGAÇÃO 19/09"): esta versão (1) segmenta
# por uma grade 2D odd x edge (faixas FECHADAS, não cumulativas) em vez
# de só edge cumulativo; (2) exige o IC95% da MEDIANA do ROI também
# positivo, além da média (critério "rigoroso", escolhido pelo usuário);
# (3) amostra mínima por célula subiu pra 50.
#
# Ferramenta de análise/pesquisa, não de produção -- não muda nenhum modelo
# de produção nem model_betting_strategy, só GRAVA o snapshot em
# `matriz_confiabilidade_ev_historico` (migration `20260919120000_...`) pra
# acompanhamento no frontend (/modelos). Cron diário às 07:30 UTC (depois
# do sync-matches de 06:00 UTC, ver CLAUDE.md, pra já pegar os placares do
# dia) -- pedido do usuário pra ver se as células confiáveis de Cartões
# continuam sobrevivendo conforme mais partidas entram no banco.
# workflow_dispatch continua disponível pra rodar sob demanda.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 7 * * *"

jobs:
  matriz-confiabilidade-ev:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar matriz de confiabilidade odd x EV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/matriz_confiabilidade_ev.py
