name: Recalcular Elo Global por xG (em paralelo)

# Elo atualizado por escore misto (25% resultado + 75% xG) -- scripts/elo_global_xg.py.
# Grava em team_elo_xg / team_elo_xg_history (tabelas PRÓPRIAS): o Elo por resultado
# (escopo='global', elo_global.yml), o painel /ratings e os modelos treinados NÃO mudam.
# A view v_elo_ab_brier compara os dois (Brier por mês, jogos com e sem xG).
#
# Sempre recalcula do zero (~30 mil partidas em segundos): evita que xG que chega atrasado
# deixe uma partida processada só por resultado. Roda às 09:30 UTC, depois do
# atualizar_stats.yml (08:00 UTC), que é quem preenche match_stats_fotmob (o xG).
#
# Sem custo de cota externa. Se falhar, abre/comenta uma issue.

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  elo-global-xg:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Recalcular Elo por xG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/elo_global_xg.py

      - name: Avisar falha (abre ou comenta numa issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = "Elo por xG: workflow elo_global_xg falhou";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const corpo = `O workflow **Recalcular Elo Global por xG** falhou em ${new Date().toISOString()}.\n\nExecução: ${url}\n\nEnquanto isso team_elo_xg fica defasado (o Elo por resultado, escopo \`global\`, não é afetado).`;
            const abertas = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existente = abertas.find((i) => !i.pull_request && i.title === titulo);
            if (existente) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existente.number, body: corpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title: titulo, body: corpo,
              });
            }
